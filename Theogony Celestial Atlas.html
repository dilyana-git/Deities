<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Theogony · Celestial Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#06080e; --bg2:#0a0e16; --panel:#090c13; --panel2:#0c1019;
    --line:#19202d; --frame:#262e3c;
    --gold:#cdb88a; --gold-dim:#8c7f5e; --gold-faint:#5a5440;
    --txt:#aab2c0; --txt-dim:#5c6678; --txt-faint:#3a4354;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1400px 900px at 78% -8%, #0e1320 0%, transparent 62%), var(--bg);
    color:var(--txt); font-family:'Crimson Pro',serif; overflow:hidden;
    height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:#cdb88a44}

  /* ── header ─────────────────────────────────────────────── */
  header{
    display:flex; align-items:center; gap:16px; padding:13px 22px;
    border-bottom:1px solid var(--line); z-index:30; flex-shrink:0;
    background:linear-gradient(180deg,rgba(8,10,16,.9),rgba(8,10,16,.5));
  }
  .wordmark{font-family:'Cinzel';font-weight:500;font-size:19px;letter-spacing:.34em;color:var(--gold);padding-left:.34em}
  .tagline{font-style:italic;font-size:16px;color:var(--txt-dim);margin-right:auto;white-space:nowrap}
  .hbtns{display:flex;gap:8px;align-items:center}
  .hbtn{
    font-family:'Cinzel';font-size:11.5px;letter-spacing:.16em;color:var(--txt-dim);
    background:transparent;border:1px solid var(--line);border-radius:7px;
    padding:7px 13px;cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:7px;
  }
  .hbtn:hover{color:var(--txt);border-color:var(--frame)}
  .hbtn.active{color:var(--gold);border-color:var(--gold-faint);background:#13110a}
  .hbtn .gl{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}

  /* ── stage ──────────────────────────────────────────────── */
  main{position:relative;flex:1;overflow:hidden}
  svg#sky{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
  svg#sky:active{cursor:grabbing}

  /* graph element styling */
  .cluster-label{font-family:'Cinzel';font-weight:500;font-size:12px;letter-spacing:.34em;
    fill:var(--txt-faint);pointer-events:none;text-transform:uppercase}
  .node-label{font-family:'Crimson Pro';font-style:italic;font-size:13px;fill:#c4cad6;
    pointer-events:none;opacity:0;transition:opacity .25s; paint-order:stroke;
    stroke:#06080e;stroke-width:3px;stroke-linejoin:round}
  .node.prominent .node-label{opacity:.62}
  svg#sky.zoomed-in .node-label{opacity:.72}
  .nodes.focusing .node-label{opacity:0}
  .nodes.focusing .node.lit .node-label{opacity:1;fill:#e7ebf2}
  .node.selected .node-label{opacity:1;fill:var(--gold)}
  .node.route .node-label{opacity:1;fill:var(--gold)}
  .node.nolabel .node-label{opacity:0 !important}

  .link{transition:opacity .22s}
  .links .link.faded{opacity:.045 !important}
  .links .link.lit{opacity:.8 !important;stroke-width:1.6px}
  .link.route{stroke:var(--gold) !important;opacity:1 !important;stroke-width:2.4px !important;stroke-dasharray:none !important}

  .node .core{transition:opacity .2s}
  .node .ring{transition:stroke .2s,stroke-width .2s,r .2s}
  .nodes.focusing .node.faded{opacity:.16}
  .node.lit .ring{stroke-width:1.6px;opacity:.9}
  .node.selected .ring{stroke:var(--gold);stroke-width:2.2px;opacity:1}
  .node.selected .core{opacity:1}
  .node.route .ring{stroke:var(--gold);stroke-width:2px;opacity:1}
  .node{transition:opacity .22s}

  /* ── floating search ────────────────────────────────────── */
  .search{position:absolute;top:16px;left:16px;z-index:20;width:262px}
  .search-field{display:flex;align-items:center;gap:9px;padding:9px 13px;
    background:rgba(10,13,20,.82);border:1px solid var(--frame);border-radius:9px;backdrop-filter:blur(8px)}
  .search-field:focus-within{border-color:var(--gold-faint)}
  .search-field svg{flex-shrink:0;opacity:.6}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--txt);
    font-family:'Crimson Pro';font-size:15px}
  .search input::placeholder{color:var(--txt-faint);font-style:italic}

  /* autocomplete */
  .ac{margin-top:5px;background:rgba(9,12,19,.96);border:1px solid var(--frame);border-radius:9px;
    overflow:hidden;display:none;box-shadow:0 16px 40px rgba(0,0,0,.5);backdrop-filter:blur(10px)}
  .ac.open{display:block}
  .ac-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 13px;
    background:none;border:none;cursor:pointer;transition:.12s;border-bottom:1px solid var(--line)}
  .ac-item:last-child{border-bottom:none}
  .ac-item:hover{background:#11151f}
  .ac-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor}
  .ac-name{font-family:'Crimson Pro';font-size:15px;color:var(--txt);flex:1}
  .ac-cat{font-family:'Cinzel';font-size:9px;letter-spacing:.12em;color:var(--txt-faint);text-transform:uppercase}
  .ac-empty{padding:10px 13px;font-style:italic;color:var(--txt-faint);font-size:14px}

  /* ── tour menu (dropdown) ───────────────────────────────── */
  .menu{position:absolute;z-index:40;min-width:248px;background:rgba(9,12,19,.97);
    border:1px solid var(--frame);border-radius:10px;padding:6px;display:none;
    box-shadow:0 18px 48px rgba(0,0,0,.55);backdrop-filter:blur(10px)}
  .menu.open{display:block;animation:pop .16s ease}
  @keyframes pop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
  #tourMenu{top:54px;right:142px}
  .tour-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:10px 12px;background:none;border:none;cursor:pointer;border-radius:7px;
    font-family:'Crimson Pro';font-size:15.5px;color:var(--txt);transition:.12s}
  .tour-item:hover{background:#12161f;color:#e7ebf2}
  .ti-mark{color:var(--gold-dim);font-size:12px}
  .ti-n{margin-left:auto;font-family:'Cinzel';font-size:10px;color:var(--txt-faint);
    border:1px solid var(--line);border-radius:10px;padding:1px 7px}

  /* ── tour bar (bottom) ──────────────────────────────────── */
  .tourbar{position:absolute;left:calc(50% - 172px);bottom:22px;transform:translateX(-50%) translateY(20px);
    z-index:25;width:min(560px,calc(100% - 392px));background:rgba(9,12,19,.94);
    border:1px solid var(--frame);border-radius:13px;padding:15px 18px 13px;
    box-shadow:0 18px 50px rgba(0,0,0,.55);backdrop-filter:blur(10px);
    opacity:0;pointer-events:none;transition:.3s}
  .tourbar.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
  .tour-top{display:flex;align-items:center;gap:10px;margin-bottom:7px}
  .tour-title{font-family:'Cinzel';font-size:12px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
  .tour-exit{margin-left:auto;background:none;border:none;color:var(--txt-faint);cursor:pointer;
    font-size:16px;line-height:1;transition:.15s}
  .tour-exit:hover{color:var(--txt)}
  .tour-caption{font-family:'Crimson Pro';font-size:18px;line-height:1.5;color:#cdd4e0;min-height:54px;
    text-wrap:pretty}
  .tour-foot{display:flex;align-items:center;gap:14px;margin-top:8px}
  .tour-dots{display:flex;gap:6px;align-items:center}
  .tdot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.2s}
  .tdot.done{background:var(--gold-faint)}
  .tdot.on{background:var(--gold);box-shadow:0 0 8px var(--gold-dim)}
  .tour-progress{font-family:'Cinzel';font-size:11px;color:var(--txt-dim);margin-left:auto}
  .tour-prev,.tour-next{font-family:'Cinzel';font-size:11px;letter-spacing:.12em;cursor:pointer;
    border:1px solid var(--frame);border-radius:7px;padding:7px 14px;background:transparent;color:var(--txt);transition:.15s}
  .tour-prev:hover,.tour-next:hover{border-color:var(--gold-faint);color:var(--gold)}
  .tour-prev:disabled{opacity:.3;cursor:default}
  .tour-next{background:#13110a;border-color:var(--gold-faint);color:var(--gold)}

  /* ── path panel ─────────────────────────────────────────── */
  .pathpanel{position:absolute;top:16px;left:16px;z-index:24;width:288px;
    background:rgba(9,12,19,.95);border:1px solid var(--frame);border-radius:12px;padding:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.5);backdrop-filter:blur(10px);display:none}
  .pathpanel.open{display:block;animation:pop .18s ease}
  .path-head{display:flex;align-items:center;margin-bottom:11px}
  .path-head h3{font-family:'Cinzel';font-size:12px;letter-spacing:.18em;color:var(--gold);margin:0;text-transform:uppercase}
  .path-close{margin-left:auto;background:none;border:none;color:var(--txt-faint);cursor:pointer;font-size:15px}
  .path-close:hover{color:var(--txt)}
  .path-slot{position:relative;margin-bottom:8px}
  .path-slot .lbl{font-family:'Cinzel';font-size:9px;letter-spacing:.16em;color:var(--txt-dim);
    text-transform:uppercase;display:block;margin-bottom:4px}
  .path-slot input{width:100%;background:rgba(6,8,14,.7);border:1px solid var(--frame);border-radius:7px;
    padding:8px 11px;color:var(--txt);font-family:'Crimson Pro';font-size:15px;outline:none}
  .path-slot input:focus{border-color:var(--gold-faint)}
  .path-slot input::placeholder{color:var(--txt-faint);font-style:italic}
  .path-result{margin-top:6px}
  .path-steps{display:flex;flex-direction:column;gap:2px;margin-top:8px}
  .path-node{display:flex;align-items:center;gap:9px;background:none;border:none;cursor:pointer;
    padding:5px 6px;border-radius:6px;transition:.12s;text-align:left}
  .path-node:hover{background:#12161f}
  .pn-dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 6px currentColor;flex-shrink:0}
  .pn-name{font-family:'Crimson Pro';font-size:15.5px;color:#dbe1ec}
  .path-rel{font-family:'Crimson Pro';font-style:italic;font-size:12.5px;color:var(--gold-dim);
    margin-left:18px;padding-left:11px;border-left:1px dotted var(--gold-faint)}
  .path-meta{font-family:'Cinzel';font-size:10px;letter-spacing:.1em;color:var(--txt-dim);margin:9px 0 0}
  .path-none{font-style:italic;color:var(--txt-dim);font-size:14px;margin:8px 0 0}

  /* ── legend popover ─────────────────────────────────────── */
  .legend{position:absolute;left:16px;bottom:16px;z-index:24;width:248px;
    background:rgba(9,12,19,.95);border:1px solid var(--frame);border-radius:12px;padding:14px 16px;
    box-shadow:0 18px 50px rgba(0,0,0,.5);backdrop-filter:blur(10px);display:none}
  .legend.open{display:block;animation:pop .18s ease}
  .legend h4{font-family:'Cinzel';font-size:10px;letter-spacing:.2em;color:var(--txt-dim);
    text-transform:uppercase;margin:0 0 8px}
  .legend h4:not(:first-of-type){margin-top:14px}
  .leg-cats,.leg-rels{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}
  .leg-rels{grid-template-columns:1fr}
  .leg-row{display:flex;align-items:center;gap:8px;font-family:'Crimson Pro';font-size:13.5px;color:var(--txt)}
  .leg-star{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .leg-line{width:18px;height:2px;border-radius:2px;flex-shrink:0}
  .legend-close{position:absolute;top:11px;right:13px;background:none;border:none;color:var(--txt-faint);
    cursor:pointer;font-size:14px}
  .legend-close:hover{color:var(--txt)}
  .leg-note{font-family:'Crimson Pro';font-style:italic;font-size:12px;color:var(--txt-faint);
    margin:12px 0 0;line-height:1.4;border-top:1px solid var(--line);padding-top:9px}

  /* ── detail panel ───────────────────────────────────────── */
  .panel{position:absolute;top:0;right:0;height:100%;width:344px;z-index:28;
    background:linear-gradient(180deg,var(--panel2),var(--panel));border-left:1px solid var(--frame);
    transform:translateX(100%);transition:transform .34s cubic-bezier(.4,0,.2,1);
    overflow-y:auto;overflow-x:hidden}
  .panel.open{transform:translateX(0);box-shadow:-22px 0 60px rgba(0,0,0,.5)}
  .panel::-webkit-scrollbar{width:8px}
  .panel::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .panel-close{position:absolute;top:12px;right:14px;z-index:2;background:rgba(6,8,14,.6);border:1px solid var(--line);
    border-radius:6px;width:26px;height:26px;color:var(--txt-dim);cursor:pointer;font-size:13px;transition:.15s}
  .panel-close:hover{color:var(--txt);border-color:var(--frame)}
  .sigil-wrap{border-bottom:1px solid var(--line);background:radial-gradient(120% 100% at 50% 0%,#0d1220,transparent)}
  .sigil{width:100%;height:auto;display:block}
  .panel-head{padding:14px 18px 13px;border-left:3px solid;border-bottom:1px solid var(--line)}
  .panel-tags{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .cat-badge{font-family:'Cinzel';font-size:9px;letter-spacing:.16em;padding:2px 8px;border:1px solid;border-radius:4px}
  .roman{font-style:italic;font-size:12px;color:var(--txt-faint)}
  .panel-name{font-family:'Cinzel';font-weight:500;font-size:23px;color:#e9edf4;margin:0;line-height:1.1}
  .panel-epithet{font-style:italic;font-size:15px;color:var(--txt-dim);margin:3px 0 0}
  .panel-body{padding:16px 18px 40px;display:flex;flex-direction:column;gap:17px}
  .panel-body section{display:flex;flex-direction:column;gap:5px}
  .lab{font-family:'Cinzel';font-size:9px;letter-spacing:.2em;color:var(--gold-dim);text-transform:uppercase}
  .panel-body p{margin:0;font-size:15.5px;line-height:1.6;color:#bcc4d2;text-wrap:pretty}
  .panel-body p.muted{font-style:italic;font-size:14px;color:var(--txt-dim);line-height:1.5}
  .arch-row{display:flex}
  .arch-pill{font-family:'Cinzel';font-size:10.5px;letter-spacing:.08em;padding:3px 11px;border:1px solid;border-radius:14px}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:12.5px;font-style:italic;color:var(--txt-dim);border:1px solid var(--line);border-radius:5px;padding:2px 8px}
  .myths{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
  .myths li{display:flex;gap:8px;font-size:14px;color:var(--txt-dim);line-height:1.4}
  .myth-mark{color:var(--gold-faint);font-size:9px;margin-top:5px;flex-shrink:0}
  .symbols{font-style:italic;font-size:13.5px;color:var(--txt-faint)}
  .conns{display:flex;flex-direction:column;gap:2px}
  .conn{display:flex;gap:9px;width:100%;text-align:left;background:none;border:none;cursor:pointer;
    padding:7px 6px;border-radius:7px;transition:.12s}
  .conn:hover{background:#11151f}
  .conn-stripe{width:2px;border-radius:2px;flex-shrink:0;align-self:stretch}
  .conn-body{display:flex;flex-direction:column;gap:1px;min-width:0}
  .conn-rel{font-family:'Cinzel';font-size:9.5px;letter-spacing:.08em}
  .conn-name{font-family:'Cinzel';font-size:14px;line-height:1.2}
  .conn-note{font-style:italic;font-size:12.5px;color:var(--txt-faint);line-height:1.3;text-wrap:pretty}

  /* ── tooltip + hint ─────────────────────────────────────── */
  #tip{position:fixed;z-index:50;pointer-events:none;opacity:0;transition:opacity .12s;
    font-family:'Cinzel';font-size:12px;letter-spacing:.08em;color:#e7ebf2;
    background:rgba(6,8,14,.9);border:1px solid var(--frame);border-radius:6px;padding:4px 9px;
    transform:translateY(-50%)}
  .hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;
    font-style:italic;font-size:13.5px;color:var(--txt-faint);pointer-events:none;transition:opacity .3s}
  .resetfloat{position:absolute;right:16px;bottom:16px;z-index:22;font-family:'Cinzel';font-size:10px;
    letter-spacing:.14em;color:var(--txt-dim);background:rgba(9,12,19,.8);border:1px solid var(--line);
    border-radius:7px;padding:7px 12px;cursor:pointer;transition:.15s}
  .resetfloat:hover{color:var(--gold);border-color:var(--gold-faint)}
</style>
</head>
<body>
  <header>
    <span class="wordmark">THEOGONY</span>
    <span class="tagline">A Web of Becoming</span>
    <div class="hbtns">
      <button class="hbtn" id="tourBtn"><span class="gl"></span>TOURS</button>
      <button class="hbtn" id="pathBtn">PATH</button>
      <button class="hbtn" id="legendBtn">LEGEND</button>
    </div>
  </header>

  <main>
    <svg id="sky"></svg>

    <!-- search -->
    <div class="search">
      <div class="search-field">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input id="searchInput" type="text" placeholder="find a figure…" autocomplete="off"/>
      </div>
      <div class="ac" id="searchResults"></div>
    </div>

    <!-- path panel -->
    <div class="pathpanel" id="pathPanel">
      <div class="path-head">
        <h3>Trace a Path</h3>
        <button class="path-close">✕</button>
      </div>
      <div class="path-slot">
        <span class="lbl">From</span>
        <input id="pathFrom" type="text" placeholder="a figure…" autocomplete="off"/>
        <div class="ac" id="pathFromResults"></div>
      </div>
      <div class="path-slot">
        <span class="lbl">To</span>
        <input id="pathTo" type="text" placeholder="another figure…" autocomplete="off"/>
        <div class="ac" id="pathToResults"></div>
      </div>
      <div class="path-result"></div>
    </div>

    <!-- tour dropdown -->
    <div class="menu" id="tourMenu"></div>

    <!-- tour bar -->
    <div class="tourbar" id="tourBar">
      <div class="tour-top">
        <span class="tour-title"></span>
        <button class="tour-exit" title="End tour">✕</button>
      </div>
      <p class="tour-caption"></p>
      <div class="tour-foot">
        <div class="tour-dots"></div>
        <button class="tour-prev">◂ Prev</button>
        <button class="tour-next">Next ▸</button>
        <span class="tour-progress"></span>
      </div>
    </div>

    <!-- legend -->
    <div class="legend" id="legend">
      <button class="legend-close" id="legendClose">✕</button>
      <h4>Entities — brightness is renown</h4>
      <div class="leg-cats"></div>
      <h4>Relations</h4>
      <div class="leg-rels"></div>
      <p class="leg-note">A figure’s star shines brighter the more myths bind it to others. Colour is a quiet hint, not a shout.</p>
    </div>

    <!-- detail panel -->
    <aside class="panel" id="panel"></aside>

    <p class="hint" id="hint">Click a star to explore · Drag to roam · Scroll to zoom</p>
    <button class="resetfloat" id="resetBtn">⤢ RESET VIEW</button>
  </main>

  <div id="tip"></div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="data/theogony-data.js"></script>
  <script src="atlas/atlas-core.js"></script>
  <script src="atlas/atlas-features.js"></script>
  <script>
    // fade the hint after first interaction
    const hint = document.getElementById('hint');
    let faded = false;
    function fadeHint(){ if(faded) return; faded=true; hint.style.opacity=0; }
    document.getElementById('sky').addEventListener('click', fadeHint);
    document.getElementById('sky').addEventListener('wheel', fadeHint, {passive:true});
    setTimeout(fadeHint, 9000);
  </script>
</body>
</html>
