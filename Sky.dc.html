</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:840,&quot;height&quot;:848},&quot;seed&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    let x = this.props.seed ?? 7
    const rnd = () => (x = (x * 16807) % 2147483647) / 2147483647
    const dots = []
    for (let i = 0; i < 110; i++) {
      const sz = 0.6 + Math.pow(rnd(), 2.4) * 2.6
      dots.push(React.createElement('div', {
        key: i,
        style: {
          position: 'absolute',
          left: (rnd() * 100).toFixed(2) + '%',
          top: (rnd() * 100).toFixed(2) + '%',
          width: sz.toFixed(2) + 'px', height: sz.toFixed(2) + 'px',
          borderRadius: '50%', background: '#e2e9f6',
          opacity: (0.1 + rnd() * 0.55).toFixed(2),
          boxShadow: sz > 2 ? '0 0 7px rgba(200,220,255,.75)' : 'none',
        },
      }))
    }
    return { stars: React.createElement('div', { style: { position: 'absolute', inset: 0, overflow: 'hidden' } }, dots) }
  }
}
</script>
</body>
