<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Theogony">
  <!-- A dark ground, not a transparent one: the mark has to hold against a
       light tab bar as well as a dark one, and the atlas is a night sky. -->
  <rect width="64" height="64" rx="14" fill="#07090f"/>
  <circle cx="32" cy="32" r="26" fill="url(#glow)"/>
  <!-- the panel's own eyebrow mark, four-pointed and gold -->
  <path d="M32 9 L35.6 27.2 L54 32 L35.6 36.8 L32 55 L28.4 36.8 L10 32 L28.4 27.2 Z" fill="#cdb88a"/>
  <circle cx="32" cy="32" r="3.4" fill="#fff7e0"/>
  <!-- two lesser stars, so it reads as sky rather than as a lone sparkle -->
  <circle cx="14.5" cy="16" r="1.9" fill="#cdb88a" opacity=".75"/>
  <circle cx="50" cy="48.5" r="1.5" fill="#cdb88a" opacity=".6"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#cdb88a" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#cdb88a" stop-opacity=".09"/>
      <stop offset="1" stop-color="#cdb88a" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
